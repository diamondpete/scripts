# Settings for pkg-update-push. Install on each machine as
# /usr/local/etc/pkg-update-push.conf, readable by root only, since the token
# lets anyone report to that monitor:
#   install -m 600 pkg-update-push.conf /usr/local/etc/

# Host name or IP address of the Uptime Kuma server.
PUSH_HOST=uptime-kuma.example

# Port of the Uptime Kuma server.
PUSH_PORT=3001

# Token from this machine's push monitor (the last part of its push URL).
PUSH_TOKEN=PASTE_TOKEN
